<!DOCTYPE html>
<html lang="fr">
<head>
	<link rel="icon" type="image/svg+xml" href="/html/assets/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue sur Webserv</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #0ea5e9;
            --accent-hover: #0284c7;
            --card-bg: #1e293b;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            text-align: center;
            max-width: 650px;
            position: relative;
            width: 100%;
        }

        /* Effet d'arrière-plan lumineux cohérent */
        .container::before {
            content: '';
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: var(--accent-color);
            opacity: 0.12;
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Zone de test POST */
        .upload-zone {
            background-color: var(--card-bg);
            border: 2px dashed var(--border-color);
            padding: 2.5rem 2rem;
            border-radius: 1rem;
            text-align: center;
            transition: border-color 0.2s, transform 0.2s;
            margin-bottom: 2rem;
        }

        .upload-zone:hover {
            border-color: var(--accent-color);
        }

        .upload-zone h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .upload-zone p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* Styling discret de l'input file natif */
        input[type="file"] {
            display: block;
            margin: 0 auto 1.5rem auto;
            color: var(--text-muted);
            font-size: 0.9rem;
            background: #0f172a;
            padding: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            max-width: 100%;
        }

        input[type="file"]::file-selector-button {
            background-color: #334155;
            color: var(--text-main);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            font-weight: 600;
            margin-right: 1rem;
            transition: background 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #475569;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--text-main);
            font-weight: 600;
            text-decoration: none;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.2);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.3);
        }

        .links-zone {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background-color: #334155;
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .links-zone { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand">Webserv Sandbox</div>
        <h1>Test de la méthode POST</h1>
        <p class="subtitle">Sélectionnez un fichier pour tester l'écriture binaire et la gestion de votre route d'upload.</p>
        
        <form action="/uploads" method="POST" enctype="multipart/form-data" class="upload-zone" id="uploadForm">
            <h3>Téléverser un fichier</h3>
            <p>Le fichier sera directement envoyé à votre serveur via une requête POST.</p>
            
            <input type="file" name="file" id="fileInput" required>
            
            <button type="submit" class="btn">Envoyer au serveur</button>
        </form>

        <div class="links-zone">
            <a href="/non-existent-page-test" class="btn补 btn-secondary btn" style="text-decoration:none; line-height: 1.5;">Déclencher la 404</a>
        </div>
    </div>

    <script>
        // Ce petit script dynamique intercepte la soumission pour s'assurer que l'URI du POST 
        // contienne le vrai nom du fichier (ex: /uploads/mon_image.png) au lieu de juste /uploads
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length > 0) {
                const filename = fileInput.files[0].name;
                // On change dynamiquement l'action pour correspondre à ton architecture de routage
                this.action = '/uploads/' + filename;
            }
        });
    </script>

</body>
</html>
