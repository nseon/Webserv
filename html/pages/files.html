<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv - Gestionnaire de fichiers</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
        h2 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }
        .section {
            margin-bottom: 40px;
        }
        label {
            display: block;
            font-size: 1rem;
            margin-bottom: 12px;
            opacity: 0.9;
        }
        
        /* Style de l'input File customisé */
        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px dashed rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            cursor: pointer;
            transition: all 0.3s;
        }
        input[type="file"]:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-upload {
            background: #fff;
            color: #764ba2;
            margin-top: 15px;
        }
        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            background: #f1f1f1;
        }

        /* Liste de fichiers moderne */
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .file-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 70%;
        }
        .btn-delete {
            width: auto;
            padding: 6px 15px;
            background: #ff4d4d;
            color: white;
            font-size: 0.85rem;
            box-shadow: none;
        }
        .btn-delete:hover {
            background: #ff3333;
            transform: scale(1.05);
        }
        .empty-msg {
            font-style: italic;
            opacity: 0.7;
            text-align: center;
        }

        /* Notifications */
        .status-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .success { background-color: rgba(72, 187, 120, 0.3); border: 1px solid #48bb78; color: #fff; }
        .error { background-color: rgba(245, 101, 101, 0.3); border: 1px solid #f56565; color: #fff; }
        
        .back-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            align-self: flex-start;
            margin-bottom: 20px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .back-link:hover { color: #fff; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div style="width: 100%; max-width: 600px; display: flex;">
        <a href="/" class="back-link">← Retour à l'accueil</a>
    </div>
        
    <div class="container">
        <div class="section">
            <h2>Téléverser un fichier</h2>
            <form id="uploadForm">
                <label for="fileInput">Choisissez un document, une image ou un binaire :</label>
                <input type="file" id="fileInput" name="file" required>
                <button type="submit" class="btn-upload">Envoyer au serveur</button>
            </form>
        </div>

        <div class="section">
            <h2>Fichiers sur le serveur</h2>
            <ul id="fileList" class="file-list">
                <li class="empty-msg" id="emptyMsg">Aucun fichier uploadé pour le moment dans cette session.</li>
            </ul>
        </div>

        <div id="statusBox" class="status-box"></div>
    </div>

    <script>
		const statusBox = document.getElementById('statusBox');
		const fileList = document.getElementById('fileList');
		const emptyMsg = document.getElementById('emptyMsg');

		// Récupération de l'historique persistant dans le navigateur
		let uploadedFiles = JSON.parse(localStorage.getItem('webserv_files')) || [];

		function showStatus(message, isSuccess) {
			statusBox.style.display = 'block';
			statusBox.className = 'status-box ' + (isSuccess ? 'success' : 'error');
			statusBox.innerText = message;
			setTimeout(() => { statusBox.style.display = 'none'; }, 5000);
		}

		function updateFileListUI() {
			// Nettoyage des anciens éléments
			document.querySelectorAll('.file-item').forEach(el => el.remove());

			if (uploadedFiles.length === 0) {
				emptyMsg.style.display = 'block';
				return;
			}
			
			emptyMsg.style.display = 'none';

			uploadedFiles.forEach(filename => {
				const li = document.createElement('li');
				li.className = 'file-item';
				
				const nameSpan = document.createElement('span');
				nameSpan.className = 'file-name';
				nameSpan.innerText = filename;

				const deleteBtn = document.createElement('button');
				deleteBtn.className = 'btn-delete';
				deleteBtn.innerText = 'Supprimer';
				deleteBtn.onclick = () => deleteFile(filename);

				li.appendChild(nameSpan);
				li.appendChild(deleteBtn);
				fileList.appendChild(li);
			});
		}

		// --- ENVOI FICHIER (POST) ---
		document.getElementById('uploadForm').addEventListener('submit', function(e) {
			e.preventDefault();
			const fileInput = document.getElementById('fileInput');
			if (fileInput.files.length === 0) return;

			const file = fileInput.files[0];
			const formData = new FormData();
			formData.append("file", file);

			fetch('/uploads/' + file.name, {
				method: 'POST',
				body: formData
			})
			.then(response => {
				if (response.status === 200 || response.status === 201) {
					showStatus(`Code HTTP ${response.status}: "${file.name}" a bien été stocké !`, true);
					
					if (!uploadedFiles.includes(file.name)) {
						uploadedFiles.push(file.name);
						localStorage.setItem('webserv_files', JSON.stringify(uploadedFiles));
						updateFileListUI();
					}
					fileInput.value = '';
				} else {
					showStatus(`Erreur HTTP ${response.status}: Le serveur a refusé l'upload.`, false);
				}
			})
			.catch(err => showStatus(`Erreur réseau ou déconnexion du Webserv.`, false));
		});

		// --- SUPPRESSION (DELETE) ---
		function deleteFile(filename) {
			fetch(`/uploads/${filename}`, {
				method: 'DELETE'
			})
			.then(response => {
				if (response.status === 200 || response.status === 204) {
					showStatus(`Code HTTP ${response.status}: "${filename}" supprimé avec succès.`, true);
					
					uploadedFiles = uploadedFiles.filter(name => name !== filename);
					localStorage.setItem('webserv_files', JSON.stringify(uploadedFiles));
					updateFileListUI();
				} else if (response.status === 404) {
					showStatus(`Code HTTP 404: Le fichier n'existe pas sur le disque.`, false);
					uploadedFiles = uploadedFiles.filter(name => name !== filename);
					localStorage.setItem('webserv_files', JSON.stringify(uploadedFiles));
					updateFileListUI();
				} else {
					showStatus(`Erreur HTTP ${response.status} lors de la suppression.`, false);
				}
			})
			.catch(err => showStatus(`Erreur réseau : impossible de joindre le serveur.`, false));
		}

		// Premier affichage au chargement de la page
		updateFileListUI();
	</script>
</body>
</html>
